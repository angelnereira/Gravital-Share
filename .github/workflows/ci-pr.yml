name: CI — Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust linting ─────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: fmt check
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-features -- -D warnings

  # ── Rust tests ────────────────────────────────────────────────────────────────
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: test
        run: cargo test --manifest-path engine/Cargo.toml --workspace --all-features

  # ── Security audit ────────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit --manifest-path engine/Cargo.toml
      - run: cargo deny --manifest-path engine/Cargo.toml check

  # ── Fuzz smoke ────────────────────────────────────────────────────────────────
  fuzz-smoke:
    name: Fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: fuzz proto parser
        working-directory: engine
        run: |
          cargo fuzz run fuzz_proto_parse -- -max_total_time=60 || true
        continue-on-error: false

  # ── Android build ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install cargo-ndk
        run: cargo install cargo-ndk@3.5.4 --locked
      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK r27c
        run: |
          sdkmanager "ndk;27.2.12479018"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.kts') }}
      - name: Build Rust .so (arm64-v8a only for CI speed)
        run: |
          cd engine
          cargo ndk -t arm64-v8a \
            -o ../android/app/src/main/jniLibs \
            build --release -p gravital-engine
      - name: Build Android APK (debug)
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gravital-share-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # ── Android unit tests ────────────────────────────────────────────────────────
  test-android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run unit tests
        run: |
          cd android
          ./gradlew test --no-daemon
